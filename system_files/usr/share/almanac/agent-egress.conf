# Agent sandbox egress allowlist — hostnames the filtering proxy will connect to.
#
# One pattern per line. `*` globs, so `*.example.com` matches subdomains but
# NOT the bare apex; list the apex separately if you mean it. Only ports 80 and
# 443 are ever permitted, whatever is listed here.
#
# This is the SYSTEM list and is replaced on every image update. Put local
# additions in ~/.config/almanac/agent-egress.conf, which is read as well and
# never overwritten:
#
#     ujust almanac-agent-egress allow example.com
#
# A warning about how complete this is: these hosts are the ones the agents are
# documented or observed to use, not the output of watching all four under
# load. An allowlist that is missing an endpoint does not fail cleanly — the
# agent hangs, or retries, or reports something unrelated. `ujust
# almanac-agent-egress log` shows what has been refused, and is the fastest way
# to find what this list is missing. Treat it as a starting point.

# --- Package installation -------------------------------------------------
# These agents install packages as part of doing their job. Omitting the
# registry produces some of the most confusing failures available.
registry.npmjs.org
*.npmjs.org

# --- Source hosting -------------------------------------------------------
# Cloning, fetching, and release downloads. codeload and objects. are separate
# hosts from github.com and are needed for archive and LFS fetches.
github.com
api.github.com
codeload.github.com
objects.githubusercontent.com
raw.githubusercontent.com

# --- claude ---------------------------------------------------------------
api.anthropic.com
console.anthropic.com
statsig.anthropic.com

# --- opencode -------------------------------------------------------------
# models.dev is where opencode fetches its provider catalogue.
models.dev
api.openai.com
openrouter.ai

