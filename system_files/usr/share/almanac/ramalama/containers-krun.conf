# Podman settings for containers started by ramalama, and nothing else.
#
# Not a containers.conf.d drop-in: /usr/bin/ramalama (the wrapper in
# /usr/libexec/almanac-ramalama) passes this file as CONTAINERS_CONF_OVERRIDE
# to ramalama alone. Every other Podman caller — distrobox, toolbox, plain
# `podman run` — keeps the default runtime.
#
# krun is crun built against libkrun (the crun-krun package, /usr/bin/krun):
# each model server runs in its own microVM rather than a plain container.
[engine]
runtime = "krun"
