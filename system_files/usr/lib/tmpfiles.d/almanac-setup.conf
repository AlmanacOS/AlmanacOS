# State for /usr/libexec/almanac-setup. The top level is root's: which setup
# flow this machine has completed, and which choices have been applied. The
# choices/ subdirectory belongs to plasma-setup, the unprivileged user the setup
# wizard runs as, because the wizard's AlmanacOS pages write choices.ini there.
d /var/lib/almanac-setup         0755 root         root         -
d /var/lib/almanac-setup/choices 0755 plasma-setup plasma-setup -
