# Import target for `ujust almanac-import-models`, and the staging area it
# verifies bundles in before promoting them. /var is not part of a bootc image,
# so these are created at boot rather than shipped.
#
# World-readable: lemond runs as the unprivileged `lemonade` user and has to be
# able to scan and mmap what was imported.
d /var/lib/almanac        0755 root root -
d /var/lib/almanac/models 0755 root root -
