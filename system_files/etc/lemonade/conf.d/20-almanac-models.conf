# Point Lemonade at the directory `ujust almanac-import-models` writes to.
#
# lemond seeds a fresh config.json from its baked-in defaults, then merges
# /usr/share/lemonade/defaults.json (owned by the lemonade package — not ours to
# edit), then whatever LEMONADE_DEFAULTS_PATH names. That last hook is the seam
# for distro overrides, so AlmanacOS uses it rather than overwriting a file that
# belongs to another package.
#
# These are defaults, not settings: a value already present in
# /var/lib/lemonade/config.json wins. On a machine where lemond wrote its config
# before this image, set it once with
#   lemonade config set extra_models_dir=/var/lib/almanac/models
LEMONADE_DEFAULTS_PATH=/usr/share/almanac/lemonade-defaults.json
