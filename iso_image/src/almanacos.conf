# Anaconda configuration profile for AlmanacOS.
#
# Installed to /etc/anaconda/profile.d/almanacos.conf and selected by
# inst.profile=almanacos on the live boot entry.
#
# It has to be selected explicitly. [Profile Detection] matches on os-release,
# and AlmanacOS inherits its os-release from ublue's kinoite-main — os_id=fedora
# and variant_id=kinoite. That is exactly what upstream's fedora-kinoite profile
# detects on, so without inst.profile that profile wins and this file is never
# read. Adding detection rules here would not fix it; it would create two
# profiles claiming the same machine.
#
# Deliberately almost empty. Everything inherited from fedora-kinoite —
# partitioning, the KDE-appropriate defaults, webui_web_engine=firefox — is
# already right for a Kinoite derivative, and overriding any of it without
# having installed from this ISO first would be guessing. This exists so that
# AlmanacOS-specific installer policy has somewhere to go once an actual install
# shows what needs changing — partitioning for the model store under /var is the
# obvious first candidate.

[Profile]
profile_id = almanacos
base_profile = fedora-kinoite
